<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caçador de Passagens</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b5fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Passagens">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14171f;--mut:#667085;--brd:#e3e7ef;--pri:#0b5fff;--ok:#0a8f4d;--okbg:#e4f6ec;--nm:#475467;--nmbg:#eef1f6}
:root:not([data-x]){color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0e1117;--card:#171b24;--tx:#eef1f7;--mut:#98a2b3;--brd:#262c3a;--pri:#6ea0ff;--ok:#4cd38a;--okbg:#10301f;--nm:#b6bfcf;--nmbg:#222836}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 16px 8px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
button{font:inherit;border:1px solid var(--brd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px}
main{padding:8px 16px 32px;display:grid;gap:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:16px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{font-size:17px;margin:0}
.chip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--nmbg);color:var(--nm)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.preco{font-size:32px;font-weight:700;margin:8px 0 0}
.preco small{font-size:13px;font-weight:400;color:var(--mut);margin-left:6px}
.mut{color:var(--mut);font-size:13px}
svg{width:100%;height:auto;display:block;margin:10px 0 4px}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--brd)}
li b{font-size:16px}
li a{color:var(--pri);text-decoration:none;font-weight:600;font-size:14px}
.vazio{text-align:center;color:var(--mut);padding:32px 16px}
</style>
</head>
<body>
<header>
  <div>
    <h1>✈️ Caçador de Passagens</h1>
    <div class="sub" id="sub">Carregando…</div>
  </div>
  <button id="atualizar" type="button">Atualizar</button>
</header>
<main id="lista"></main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const brl = v => v.toLocaleString("pt-BR", {style: "currency", currency: "BRL", maximumFractionDigits: 0});
const dm = s => s.slice(8, 10) + "/" + s.slice(5, 7);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const seguro = u => (typeof u === "string" && u.startsWith("https://")) ? u : null;

function grafico(serie) {
  if (!serie || serie.length < 2) {
    return '<div class="mut" style="margin:10px 0">O gráfico aparece depois de algumas rodadas.</div>';
  }
  const W = 300, H = 70, P = 6;
  const vals = serie.map(s => s.min);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const pts = serie.map((s, i) => {
    const x = P + i * (W - 2 * P) / (serie.length - 1);
    const y = H - P - (s.min - lo) / span * (H - 2 * P);
    return [x.toFixed(1), y.toFixed(1)];
  });
  const ult = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Menor preço por dia">' +
    '<polyline fill="none" stroke="var(--pri)" stroke-width="2" stroke-linejoin="round" points="' +
    pts.map(p => p.join(",")).join(" ") + '"/>' +
    '<circle cx="' + ult[0] + '" cy="' + ult[1] + '" r="3.5" fill="var(--pri)"/></svg>' +
    '<div class="mut" style="display:flex;justify-content:space-between"><span>menor: ' + brl(lo) +
    '</span><span>maior: ' + brl(hi) + '</span></div>';
}

function cartao(cod, d, descMin) {
  const of = d.ofertas || [];
  const melhor = of.length ? Math.min(...of.map(o => o.preco)) : null;
  let chip = '<span class="chip">sem dados</span>';
  if (melhor !== null) {
    const barato = d.mediana ? melhor <= d.mediana * (1 - descMin) : melhor <= d.limite;
    chip = barato ? '<span class="chip ok">preço baixo</span>' : '<span class="chip">preço normal</span>';
  }
  const ref = (d.mediana ? "Mediana: " + brl(d.mediana) + " · " : "") + "Seu limite: " + brl(d.limite);
  const itens = of.slice(0, 5).map(o => {
    const esc1 = o.escalas === 0 ? "direto" : o.escalas + " escala";
    const url = seguro(o.link);
    return "<li><div><b>" + brl(o.preco) + "</b><div class='mut'>" + dm(o.ida) + " → " + dm(o.volta) +
      " · " + esc(esc1) + " · " + esc(o.fonte) + "</div></div>" +
      (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">Abrir</a>' : "") + "</li>";
  }).join("");
  return '<section class="card"><div class="topo"><h2>' + esc(d.nome || cod) + "</h2>" + chip + "</div>" +
    (melhor !== null ? '<div class="preco">' + brl(melhor) + "<small>melhor agora</small></div>" : "") +
    '<div class="mut">' + esc(ref) + "</div>" + grafico(d.serie) +
    (itens ? "<ul>" + itens + "</ul>" : '<div class="mut">Sem ofertas na última rodada.</div>') + "</section>";
}

async function carregar() {
  const sub = $("#sub"), lista = $("#lista");
  try {
    const r = await fetch("dados.json?ts=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const dados = await r.json();
    const cods = Object.keys(dados.destinos || {});
    if (!dados.atualizado || !cods.length) {
      sub.textContent = "Ainda sem dados";
      lista.innerHTML = '<div class="vazio">A primeira rodada do programa preenche esta tela.</div>';
      return;
    }
    const quando = new Date(dados.atualizado).toLocaleString("pt-BR", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});
    sub.textContent = "Saindo de " + dados.origem + " · atualizado em " + quando;
    lista.innerHTML = cods.map(c => cartao(c, dados.destinos[c], dados.desconto_min || 0.3)).join("");
  } catch (e) {
    sub.textContent = "Não foi possível carregar";
    lista.innerHTML = '<div class="vazio">Sem conexão ou sem dados ainda. Toque em Atualizar.</div>';
  }
}

$("#atualizar").addEventListener("click", carregar);
carregar();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
